[project]
name = "deepseek-whale-widget-pyqt"
version = "0.1.0"
description = "DeepSeek 余额小鲸鱼桌面挂件（PyQt 版）：常驻透明小鲸鱼 + 余额/今日已用气泡 + 峰谷定价 + 随机台词 + 音效 + 拖拽吸附"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yinbailiang" }]
keywords = ["deepseek", "balance", "widget", "pyqt", "desktop", "whale"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "pyqt6>=6.11.0",
]

[project.scripts]
dsh-whale-widget = "deepseek_whale_widget.app:main"

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_whale_widget"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "deepseek_whale_widget/assets"

[tool.hatch.build.targets.sdist]
include = ["src", "assets", "README.md"]
